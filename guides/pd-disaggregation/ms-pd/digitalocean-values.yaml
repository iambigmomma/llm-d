# DigitalOcean P/D Disaggregation Minimal Override
# This file contains ONLY the values that need to be overridden for DigitalOcean DOKS
# Architecture: 1 Prefill Pod (1 GPU) + 1 Decode Pod (1 GPU) = 2 GPUs total

# Use smaller public model - no HuggingFace token required
modelArtifacts:
  uri: "hf://Qwen/Qwen2.5-3B-Instruct"
  size: 8Gi  # Smaller model
  name: "Qwen/Qwen2.5-3B-Instruct"
  authSecretName: ""  # Disable HF token for public model

# Enable direct Service routing (bypass InferencePool)
routing:
  modelName: Qwen/Qwen2.5-3B-Instruct  # Match the model name
  # Disable HTTPRoute to avoid InferencePool dependency
  httpRoute:
    create: false
  # Disable InferencePool creation
  inferencePool:
    create: false
  # Create InferenceModel for service discovery
  inferenceModel:
    create: true
    criticality: Critical

# Decode Pod: Reduce from 4 GPUs to 1 GPU for DOKS compatibility
decode:
  containers:
  - name: "vllm"
    image: "ghcr.io/llm-d/llm-d:v0.2.0"  # Use stable version
    modelCommand: vllmServe  # Required by chart
    args:
      - "--tensor-parallel-size"
      - "1"  # Single GPU instead of 4
      - "--block-size"
      - "128"
      - "--kv-transfer-config"
      - '{"kv_connector":"NixlConnector", "kv_role":"kv_both"}'
      - "--disable-log-requests"
      - "--disable-uvicorn-access-log"
      - "--max-model-len"
      - "8192"  # Reduced for smaller model
    resources:
      limits:
        memory: 16Gi  # Reduced from 64Gi
        cpu: "4"      # Reduced from 16
        nvidia.com/gpu: "1"  # Reduced from 4
        # Remove RDMA requirement for DigitalOcean
      requests:
        memory: 16Gi
        cpu: "4"
        nvidia.com/gpu: "1"
  # DigitalOcean GPU node tolerations
  tolerations:
  - key: "nvidia.com/gpu"
    operator: "Exists"
    effect: "NoSchedule"

# Prefill Pods: Reduce from 4 replicas to 1 replica
prefill:
  replicas: 1  # Single prefill pod instead of 4
  containers:
  - name: "vllm"
    image: "ghcr.io/llm-d/llm-d:v0.2.0"  # Use stable version
    modelCommand: vllmServe  # Required by chart
    args:
      - "--block-size"
      - "128"
      - "--kv-transfer-config"
      - '{"kv_connector":"NixlConnector", "kv_role":"kv_both"}'
      - "--disable-log-requests"
      - "--disable-uvicorn-access-log"
      - "--max-model-len"
      - "8192"  # Reduced for smaller model
    resources:
      limits:
        memory: 16Gi  # Reduced from 64Gi
        cpu: "4"      # Reduced from 8
        nvidia.com/gpu: "1"  # Same GPU count
        # Remove RDMA requirement for DigitalOcean
      requests:
        memory: 16Gi
        cpu: "4"
        nvidia.com/gpu: "1"
  # DigitalOcean GPU node tolerations
  tolerations:
  - key: "nvidia.com/gpu"
    operator: "Exists"
    effect: "NoSchedule"