# Services for P/D Disaggregation
apiVersion: v1
kind: Service
metadata:
  name: ms-pd-llm-d-modelservice-prefill
  namespace: llm-d-pd
spec:
  ports:
  - name: http
    port: 8000
    protocol: TCP
    targetPort: 8000
  selector:
    llm-d.ai/inferenceServing: "true"
    llm-d.ai/model: ms-pd-llm-d-modelservice
    llm-d.ai/role: prefill
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: ms-pd-llm-d-modelservice-decode
  namespace: llm-d-pd
spec:
  ports:
  - name: http
    port: 8000
    protocol: TCP
    targetPort: 8000
  selector:
    llm-d.ai/inferenceServing: "true"
    llm-d.ai/model: ms-pd-llm-d-modelservice
    llm-d.ai/role: decode
  type: ClusterIP
---
# HTTPRoute for DigitalOcean P/D Disaggregation
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-d-pd-disaggregation
  namespace: llm-d-pd
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: infra-pd-inference-gateway
  rules:
    - backendRefs:
      - kind: Service
        name: ms-pd-llm-d-modelservice-prefill
        port: 8000
        weight: 1
      timeouts:
        backendRequest: 0s
        request: 0s
      matches:
      - path:
          type: PathPrefix
          value: /